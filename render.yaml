# Render Blueprint — Backlink Scout
# https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub/GitLab, then in Render:
#   New → Blueprint → connect repo → apply
#
# Free web services sleep after ~15 min idle and use an ephemeral disk
# (CSV files are lost on restart).
#
# Playwright browsers must live under the project tree — Render's default
# cache (/opt/render/.cache) does not persist from build → runtime.

services:
  - type: web
    name: backlink-scout
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium
    startCommand: uvicorn backlink_checker.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Keep Chromium in the deployable project dir (not build-only cache)
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright
